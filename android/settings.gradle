// Repositories are declared once here, for plugins and for dependencies alike.
//
// Google's Maven Central mirror comes before mavenCentral() on purpose: it
// serves the same artifacts, and some networks rate-limit repo.maven.apache.org
// hard enough that a cold build never finishes. mavenCentral() stays as the
// fallback for anything the mirror is missing.
pluginManagement {
    repositories {
        google()
        maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}

rootProject.name = "NOVA"
include ":app"
